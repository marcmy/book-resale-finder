name: Apply concise completion hotfix

on:
  push:
    branches:
      - fix/concise-completion-v1.1.2

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          ref: fix/concise-completion-v1.1.2
          fetch-depth: 0

      - name: Apply patch
        run: python scripts/apply_concise_hotfix.py

      - name: Remove temporary patch files
        run: |
          rm scripts/apply_concise_hotfix.py
          rm .github/workflows/apply-concise-completion.yml

      - name: Commit hotfix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Keep completion output concise"
          git push origin HEAD:fix/concise-completion-v1.1.2
