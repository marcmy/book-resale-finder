name: Build and Release

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release:
        description: Create or update the GitHub release for the version in pyproject.toml
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: book-resale-finder-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-build-release:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements-build.txt pytest

      - name: Run tests
        run: python -m pytest

      - name: Generate application icon
        run: python scripts/generate_icon.py

      - name: Build executable
        run: python -m PyInstaller --noconfirm --clean BookResaleFinder.spec

      - name: Smoke-test frozen executable
        shell: pwsh
        run: |
          $exe = Join-Path $PWD 'dist/BookResaleFinder/BookResaleFinder.exe'
          $env:BRF_SMOKE_TEST = '1'
          $process = Start-Process -FilePath $exe -WorkingDirectory (Split-Path $exe) -PassThru
          $finished = $process.WaitForExit(30000)
          Remove-Item Env:BRF_SMOKE_TEST -ErrorAction SilentlyContinue

          if (-not $finished) {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            throw 'Frozen executable did not finish its startup smoke test within 30 seconds.'
          }

          if ($process.ExitCode -ne 0) {
            $logs = @(
              (Join-Path $env:LOCALAPPDATA 'Book Resale Finder/startup.log'),
              (Join-Path (Split-Path $exe) 'startup.log')
            )
            foreach ($log in $logs) {
              if (Test-Path $log) {
                Write-Host "---- $log ----"
                Get-Content $log
              }
            }
            throw "Frozen executable exited with code $($process.ExitCode)."
          }

      - name: Read application version
        id: version
        shell: pwsh
        run: |
          $version = python -c "import pathlib, tomllib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text(encoding='utf-8'))['project']['version'])"
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT

      - name: Assemble portable package
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $packageRoot = Join-Path $PWD "package/BookResaleFinder-$version"
          Remove-Item (Split-Path $packageRoot) -Recurse -Force -ErrorAction SilentlyContinue
          New-Item $packageRoot -ItemType Directory -Force | Out-Null

          Copy-Item 'dist/BookResaleFinder/*' $packageRoot -Recurse -Force
          Copy-Item 'config.yaml' $packageRoot
          Copy-Item 'masterlist.csv' $packageRoot
          Copy-Item 'README.md' $packageRoot
          New-Item (Join-Path $packageRoot 'output') -ItemType Directory -Force | Out-Null

          $zip = "BookResaleFinder-$version-Windows-x64.zip"
          Compress-Archive -Path $packageRoot -DestinationPath $zip -Force
          (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant() + "  " + $zip |
            Set-Content "$zip.sha256" -Encoding ascii

      - name: Smoke-test packaged executable
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $exe = Join-Path $PWD "package/BookResaleFinder-$version/BookResaleFinder.exe"
          $env:BRF_SMOKE_TEST = '1'
          $process = Start-Process -FilePath $exe -WorkingDirectory (Split-Path $exe) -PassThru
          $finished = $process.WaitForExit(30000)
          Remove-Item Env:BRF_SMOKE_TEST -ErrorAction SilentlyContinue

          if (-not $finished) {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            throw 'Packaged executable did not finish its startup smoke test within 30 seconds.'
          }
          if ($process.ExitCode -ne 0) {
            throw "Packaged executable exited with code $($process.ExitCode)."
          }

      - name: Upload Windows build artifact
        uses: actions/upload-artifact@v7
        with:
          name: BookResaleFinder-${{ steps.version.outputs.version }}-Windows-x64
          path: |
            BookResaleFinder-${{ steps.version.outputs.version }}-Windows-x64.zip
            BookResaleFinder-${{ steps.version.outputs.version }}-Windows-x64.zip.sha256
          if-no-files-found: error

      - name: Create or update GitHub release
        if: >-
          (github.event_name == 'push' && contains(github.event.head_commit.message, '[release]')) ||
          (github.event_name == 'workflow_dispatch' && inputs.release)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $zip = "BookResaleFinder-$env:RELEASE_VERSION-Windows-x64.zip"
          $checksum = "$zip.sha256"
          $title = "Book Resale Finder $env:RELEASE_VERSION"

          gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:RELEASE_TAG $zip $checksum --clobber --repo $env:GITHUB_REPOSITORY
            gh release edit $env:RELEASE_TAG --title $title --notes-file CHANGELOG.md --latest --repo $env:GITHUB_REPOSITORY
          } else {
            gh release create $env:RELEASE_TAG $zip $checksum `
              --target $env:GITHUB_SHA `
              --title $title `
              --notes-file CHANGELOG.md `
              --latest `
              --repo $env:GITHUB_REPOSITORY
          }
