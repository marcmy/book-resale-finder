name: Apply local quota reset time

on:
  push:
    branches:
      - fix/local-quota-reset-v1.1.3

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          ref: fix/local-quota-reset-v1.1.3
          fetch-depth: 0

      - name: Apply patch
        run: python .github/scripts/apply_local_reset.py

      - name: Remove temporary patch files
        run: rm .github/workflows/apply-local-reset-time.yml .github/scripts/apply_local_reset.py

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Format quota reset in local time"
          git push origin HEAD:fix/local-quota-reset-v1.1.3
