name: Sourcing Cockpit Build

on:
  pull_request:
    paths:
      - "sourcing_cockpit/**"
      - ".github/workflows/sourcing-cockpit-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sourcing-cockpit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    env:
      AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
      AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: sourcing_cockpit/requirements-helper.txt

      - name: Read and validate application version
        id: version
        shell: pwsh
        run: |
          $match = Select-String -Path sourcing_cockpit/helper.py -Pattern '^APP_VERSION = "([^"]+)"$'
          if (-not $match) { throw 'Could not read APP_VERSION from helper.py.' }
          $version = $match.Matches[0].Groups[1].Value
          $manifest = Get-Content sourcing_cockpit/extension/manifest.json -Raw | ConvertFrom-Json
          if ($manifest.version -ne $version) {
            throw "Version mismatch: helper=$version extension=$($manifest.version)"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Sourcing Cockpit version: $version"

      - name: Install helper build dependencies
        run: python -m pip install -r sourcing_cockpit/requirements-helper.txt

      - name: Compile Python sources
        run: |
          python -m py_compile sourcing_cockpit/helper.py
          python -m py_compile sourcing_cockpit/bridge/server.py

      - name: Run bridge unit tests
        shell: pwsh
        run: |
          Push-Location sourcing_cockpit/bridge
          python -m unittest test_server.py
          Pop-Location

      - name: Build standalone helper
        shell: pwsh
        run: |
          Push-Location sourcing_cockpit
          python -m PyInstaller --noconfirm --clean SourcingCockpitHelper.spec
          Pop-Location
          if (-not (Test-Path sourcing_cockpit/dist/SourcingCockpitHelper.exe)) {
            throw 'SourcingCockpitHelper.exe was not produced.'
          }

      - name: Smoke-test frozen helper
        shell: pwsh
        run: |
          $exe = Join-Path $PWD 'sourcing_cockpit/dist/SourcingCockpitHelper.exe'
          $process = Start-Process -FilePath $exe -ArgumentList '--smoke-test' -PassThru -Wait
          if ($process.ExitCode -ne 0) {
            throw "Frozen Sourcing Cockpit helper exited with code $($process.ExitCode)."
          }

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Validate Chromium extension JavaScript
        shell: pwsh
        run: |
          Get-ChildItem sourcing_cockpit/extension -Recurse -Filter *.js | ForEach-Object {
            node --check $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "JavaScript syntax check failed: $($_.FullName)" }
          }

      - name: Stage Firefox Promise-API build
        shell: pwsh
        run: |
          $source = Join-Path $PWD 'sourcing_cockpit/extension'
          $firefox = Join-Path $PWD 'sourcing_cockpit/build/firefox-src'
          Remove-Item $firefox -Recurse -Force -ErrorAction SilentlyContinue
          New-Item $firefox -ItemType Directory -Force | Out-Null
          Copy-Item "$source/*" $firefox -Recurse -Force

          # The maintained source uses Chrome's namespace so the same files run directly in
          # Chromium MV3. Firefox exposes Promise-based APIs under browser.*, while its chrome.*
          # compatibility namespace is callback-oriented. Build a Firefox-specific package by
          # switching extension API calls to browser.* without changing application logic.
          Get-ChildItem $firefox -Recurse -Filter *.js | ForEach-Object {
            $text = Get-Content $_.FullName -Raw
            $text = $text.Replace('chrome.', 'browser.')
            Set-Content $_.FullName $text -Encoding utf8NoBOM
            node --check $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "Firefox JavaScript transform failed: $($_.FullName)" }
          }

      - name: Lint and package Firefox extension
        id: firefox
        shell: pwsh
        run: |
          $source = Join-Path $PWD 'sourcing_cockpit/build/firefox-src'
          $out = Join-Path $PWD 'sourcing_cockpit/build/firefox'
          Remove-Item $out -Recurse -Force -ErrorAction SilentlyContinue
          New-Item $out -ItemType Directory -Force | Out-Null

          npx --yes web-ext@10 lint --source-dir $source
          if ($LASTEXITCODE -ne 0) { throw 'web-ext lint failed.' }

          npx --yes web-ext@10 build --source-dir $source --artifacts-dir $out --overwrite-dest
          if ($LASTEXITCODE -ne 0) { throw 'web-ext build failed.' }

          if ($env:AMO_JWT_ISSUER -and $env:AMO_JWT_SECRET) {
            npx --yes web-ext@10 sign `
              --source-dir $source `
              --artifacts-dir $out `
              --channel unlisted `
              --approval-timeout 3600000 `
              --api-key $env:AMO_JWT_ISSUER `
              --api-secret $env:AMO_JWT_SECRET
            if ($LASTEXITCODE -ne 0) { throw 'Mozilla signing failed.' }

            $signed = Get-ChildItem $out -Filter *.xpi | Sort-Object LastWriteTime -Descending | Select-Object -First 1
            if (-not $signed) { throw 'Mozilla signing succeeded but no XPI was downloaded.' }
            Copy-Item $signed.FullName (Join-Path $out 'SourcingCockpit.xpi') -Force
            'signed=true' >> $env:GITHUB_OUTPUT
          } else {
            Write-Host 'AMO signing secrets are not configured; producing developer artifacts only.'
            'signed=false' >> $env:GITHUB_OUTPUT
          }

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $known = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6/ISCC.exe'
          if (-not (Test-Path $known)) {
            choco install innosetup --no-progress -y
          }

      - name: Build Windows installer
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6/ISCC.exe'
          if (-not (Test-Path $iscc)) { throw 'ISCC.exe not found.' }
          & $iscc "/DMyAppVersion=$version" "/DRepoRoot=$PWD" "sourcing_cockpit/installer/SourcingCockpit.iss"
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup build failed.' }

      - name: Prepare end-user release package
        if: steps.firefox.outputs.signed == 'true'
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $release = Join-Path $PWD 'sourcing_cockpit/dist/release'
          Remove-Item $release -Recurse -Force -ErrorAction SilentlyContinue
          New-Item $release -ItemType Directory -Force | Out-Null
          $installerName = "SourcingCockpit-Setup-$version.exe"
          $installer = Join-Path $PWD "sourcing_cockpit/dist/installer/$installerName"
          if (-not (Test-Path $installer)) { throw "Installer not found: $installer" }
          Copy-Item $installer (Join-Path $release $installerName)
          $hash = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $installerName" | Set-Content (Join-Path $release 'SHA256.txt') -Encoding ascii

      - name: Upload end-user release
        if: steps.firefox.outputs.signed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: SourcingCockpit-Windows-${{ steps.version.outputs.version }}
          path: sourcing_cockpit/dist/release/*
          if-no-files-found: error

      - name: Upload developer artifacts
        uses: actions/upload-artifact@v7
        with:
          name: SourcingCockpit-Developer-${{ steps.version.outputs.version }}
          path: |
            sourcing_cockpit/dist/SourcingCockpitHelper.exe
            sourcing_cockpit/dist/installer/SourcingCockpit-Setup-${{ steps.version.outputs.version }}.exe
            sourcing_cockpit/build/firefox/*
          if-no-files-found: error
