name: Apply search quota fix

on:
  push:
    branches:
      - fix/search-quota-and-request-breakdown-v1.1.4

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          ref: fix/search-quota-and-request-breakdown-v1.1.4
          fetch-depth: 0

      - name: Apply patch
        run: python .github/scripts/apply_search_quota_fix.py

      - name: Remove temporary patch files
        shell: bash
        run: |
          rm .github/workflows/apply-search-quota-fix.yml
          rm .github/scripts/apply_search_quota_fix.py

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix search quota selection and request breakdown"
          git push origin HEAD:fix/search-quota-and-request-breakdown-v1.1.4
