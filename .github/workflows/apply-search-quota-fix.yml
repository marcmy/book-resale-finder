name: Apply search quota fix

on:
  push:
    branches:
      - fix/search-quota-and-request-breakdown-v1.1.4

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          ref: fix/search-quota-and-request-breakdown-v1.1.4
          fetch-depth: 0

      - name: Apply patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          ebay_path = Path("book_resale_finder/ebay.py")
          ebay = ebay_path.read_text(encoding="utf-8")
          ebay = ebay.replace("import base64\n", "import base64\nimport re\n", 1)
          marker = "    async def fetch_quota(self) -> QuotaInfo:\n"
          if marker not in ebay:
              raise RuntimeError("fetch_quota marker not found")
          ebay = ebay.split(marker, 1)[0] + '''    @staticmethod
    def _quota_from_payload(payload: dict[str, Any]) -> QuotaInfo:
        """Return the Browse item_summary/search quota, never the item-detail quota."""
        ranked_resources: list[tuple[int, dict[str, Any]]] = []
        for group in payload.get("rateLimits") or []:
            api_name = str(group.get("apiName") or "").casefold()
            api_context = str(group.get("apiContext") or "").casefold()
            if api_name and api_name != "browse":
                continue
            if api_context and api_context != "buy":
                continue

            for resource in group.get("resources") or []:
                raw_name = str(resource.get("name") or "")
                normalized = re.sub(r"[^a-z0-9]+", "_", raw_name.casefold()).strip("_")
                if normalized == "item_summary":
                    score = 100
                elif "item_summary" in normalized:
                    score = 90
                elif normalized == "search":
                    score = 80
                elif "search" in normalized:
                    score = 70
                else:
                    continue
                ranked_resources.append((score, resource))

        if not ranked_resources:
            return QuotaInfo()

        resource = max(ranked_resources, key=lambda entry: entry[0])[1]
        rates = resource.get("rates") or []
        if not rates:
            return QuotaInfo()

        def time_window(rate: dict[str, Any]) -> int | None:
            try:
                return int(rate.get("timeWindow"))
            except (TypeError, ValueError):
                return None

        rate = next((candidate for candidate in rates if time_window(candidate) == 86400), rates[0])
        try:
            limit = int(rate.get("limit")) if rate.get("limit") is not None else None
            remaining = int(rate.get("remaining")) if rate.get("remaining") is not None else None
            if rate.get("count") is not None:
                used = int(rate.get("count"))
            else:
                used = limit - remaining if limit is not None and remaining is not None else None
        except (TypeError, ValueError):
            limit = used = remaining = None

        return QuotaInfo(
            limit=limit,
            used=used,
            remaining=remaining,
            reset_at=str(rate.get("reset") or "") or None,
        )

    async def fetch_quota(self) -> QuotaInfo:
        try:
            payload = await self._request_json(
                "GET",
                RATE_LIMIT_URL,
                params={"api_name": "browse", "api_context": "buy"},
                count_as_api_call=False,
            )
        except Exception:
            return QuotaInfo()
        return self._quota_from_payload(payload)
'''
          ebay_path.write_text(ebay, encoding="utf-8")

          gui_path = Path("book_resale_finder/gui.py")
          gui = gui_path.read_text(encoding="utf-8")
          gui = gui.replace(
              '            "Daily requests remaining",\n            "The remaining daily quota reported by eBay. This separate counter can update later than the scan total.",',
              '            "Daily searches remaining",\n            "The remaining daily quota for eBay Browse searches. Item-detail calls use a separate quota.",',
              1,
          )
          completion_marker = '''    @Slot(object)
    def _on_completed(self, summary: RunSummary) -> None:
'''
          helper = '''    @staticmethod
    def _format_request_usage(summary: RunSummary) -> str:
        first = summary.api_call_breakdown.get("primary_search", 0)
        second = summary.api_call_breakdown.get("fallback_search", 0)
        shipping = summary.api_call_breakdown.get("shipping_detail", 0)
        known = first + second + shipping
        if not summary.api_call_breakdown or known != summary.api_calls:
            return f"eBay requests used: {summary.api_calls:,}"

        parts = [f"{first:,} first searches"]
        if second:
            parts.append(f"{second:,} second searches")
        if shipping:
            parts.append(f"{shipping:,} shipping checks")
        return f"eBay requests used: {summary.api_calls:,} ({' + '.join(parts)})"

'''
          if completion_marker not in gui:
              raise RuntimeError("completion marker not found")
          gui = gui.replace(completion_marker, helper + completion_marker, 1)
          gui = gui.replace(
              '''        quota_is_stale = (
            summary.api_calls > 0
''',
              '''        search_calls = (
            summary.api_call_breakdown.get("primary_search", 0)
            + summary.api_call_breakdown.get("fallback_search", 0)
        )
        quota_is_stale = (
            search_calls > 0
''',
              1,
          )
          gui = gui.replace('        self.api_value.setText(str(summary.api_calls))\n', '        self.api_value.setText(f"{summary.api_calls:,}")\n', 1)
          gui = gui.replace('            f"eBay requests used: {summary.api_calls}",\n', '            self._format_request_usage(summary),\n', 1)
          gui = gui.replace('Daily eBay quota remaining:', 'Daily eBay search quota remaining:')
          gui = gui.replace('* eBay quota reporting may be delayed.', '* eBay search-quota reporting may be delayed.')
          gui_path.write_text(gui, encoding="utf-8")

          replacements = {
              Path("book_resale_finder/constants.py"): ('VERSION = "1.1.3"', 'VERSION = "1.1.4"'),
              Path("book_resale_finder/__init__.py"): ('__version__ = "1.1.3"', '__version__ = "1.1.4"'),
              Path("pyproject.toml"): ('version = "1.1.3"', 'version = "1.1.4"'),
          }
          for path, (old, new) in replacements.items():
              text = path.read_text(encoding="utf-8")
              if old not in text:
                  raise RuntimeError(f"Version marker not found in {path}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          changelog_path = Path("CHANGELOG.md")
          changelog = changelog_path.read_text(encoding="utf-8")
          if not changelog.startswith("# Changelog\n\n"):
              raise RuntimeError("Unexpected changelog format")
          entry = '''# Changelog

## 1.1.4

- Fixed the quota display to select eBay's `item_summary` search quota instead of the unused item-detail quota.
- Renamed the quota output to make clear that it applies to Browse searches.
- Added a compact per-run breakdown such as `1,706 first searches + 1,348 second searches`.

'''
          changelog_path.write_text(entry + changelog[len("# Changelog\n\n"):], encoding="utf-8")

          ebay_tests_path = Path("tests/test_ebay_logic.py")
          ebay_tests = ebay_tests_path.read_text(encoding="utf-8")
          ebay_tests += '''


def test_quota_parser_prefers_search_resource_over_item_details():
    payload = {
        "rateLimits": [
            {
                "apiContext": "buy",
                "apiName": "browse",
                "resources": [
                    {
                        "name": "item",
                        "rates": [{"limit": 5000, "count": 0, "remaining": 5000, "timeWindow": 86400}],
                    },
                    {
                        "name": "item_summary",
                        "rates": [
                            {
                                "limit": 5000,
                                "count": 3054,
                                "remaining": 1946,
                                "reset": "2026-08-06T07:00:00.000Z",
                                "timeWindow": 86400,
                            }
                        ],
                    },
                ],
            }
        ]
    }
    quota = EbayClient._quota_from_payload(payload)
    assert quota.limit == 5000
    assert quota.used == 3054
    assert quota.remaining == 1946
    assert quota.reset_at == "2026-08-06T07:00:00.000Z"


def test_quota_parser_does_not_misreport_item_detail_quota_as_search_quota():
    payload = {
        "rateLimits": [
            {
                "apiContext": "buy",
                "apiName": "browse",
                "resources": [
                    {
                        "name": "item",
                        "rates": [{"limit": 5000, "count": 0, "remaining": 5000, "timeWindow": 86400}],
                    }
                ],
            }
        ]
    }
    quota = EbayClient._quota_from_payload(payload)
    assert quota.remaining is None
'''
          ebay_tests_path.write_text(ebay_tests, encoding="utf-8")

          gui_tests_path = Path("tests/test_gui_presentation.py")
          gui_tests = gui_tests_path.read_text(encoding="utf-8")
          gui_tests = gui_tests.replace(
              "from datetime import timedelta, timezone\n",
              "from datetime import timedelta, timezone\nfrom pathlib import Path\n",
              1,
          )
          gui_tests = gui_tests.replace(
              "from book_resale_finder.gui import MainWindow\n",
              "from book_resale_finder.gui import MainWindow\nfrom book_resale_finder.models import RunSummary\n",
              1,
          )
          gui_tests += '''


def test_request_usage_compactly_explains_large_run_total():
    summary = RunSummary(
        total_identifiers=1706,
        unique_identifiers=1706,
        found=1611,
        no_match=95,
        failed=0,
        api_calls=3054,
        elapsed_seconds=0,
        output_file=Path("results.xlsx"),
        api_call_breakdown={"primary_search": 1706, "fallback_search": 1348},
    )
    assert MainWindow._format_request_usage(summary) == (
        "eBay requests used: 3,054 (1,706 first searches + 1,348 second searches)"
    )
'''
          gui_tests_path.write_text(gui_tests, encoding="utf-8")
          PY

      - name: Remove temporary workflow
        shell: bash
        run: rm .github/workflows/apply-search-quota-fix.yml

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix search quota selection and request breakdown"
          git push origin HEAD:fix/search-quota-and-request-breakdown-v1.1.4
