<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Sourcing Cockpit</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <h1>Sourcing Cockpit</h1>
  <div id="health" class="muted">Checking bridge…</div>

  <div class="stats">
    <div><strong id="bookmarks">0</strong><span>watched</span></div>
    <div><strong id="gates">0</strong><span>gates</span></div>
    <div><strong id="history">0</strong><span>history</span></div>
  </div>

  <div class="row">
    <button id="clear-cache">Clear eligibility cache</button>
    <button id="options">Options</button>
  </div>

  <h2>Team sync</h2>
  <div class="row">
    <button id="pull">Pull Gist</button>
    <button id="push">Push Gist</button>
  </div>
  <div id="message" class="muted"></div>

  <script src="../lib/common.js"></script>
  <script src="popup.js"></script>
</body>
</html>
